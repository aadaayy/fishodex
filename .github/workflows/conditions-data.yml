# Gathers the station list and sample responses for auto conditions (run by hand).
name: Conditions data
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['Tools/conditions/**', '.github/workflows/conditions-data.yml']
permissions:
  contents: write  # only to publish the output to its own branch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 Tools/conditions/fetch_reference.py out
      - name: Publish to the conditions-data branch
        run: |
          cd out
          git init -q -b conditions-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Conditions data from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" conditions-data
